services:
  atelier:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    # Bind privately when using a host-based HTTPS reverse proxy.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    read_only: true
    tmpfs:
      - /tmp:size=2g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
