# EXAMPLE ONLY. Replace the hostname and certificate paths before use.
# PUBLIC_APP_URL must match this public HTTPS origin.
server {
    listen 443 ssl;
    server_name atelier.your-domain.com;
    ssl_certificate /etc/letsencrypt/live/atelier.your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atelier.your-domain.com/privkey.pem;

    client_max_body_size 200m;

    # This app intentionally disables access logs to avoid logging OAuth
    # authorization codes in callback query strings. Also check your CDN/WAF.
    access_log off;
    error_log /dev/null crit; # Do not leak callback queries through proxy error logs.

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # For exactly one trusted proxy, overwrite instead of appending untrusted input.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 620s;
        proxy_send_timeout 620s;
    }
}
# Redirect port 80 to HTTPS only after configuring a valid certificate.
